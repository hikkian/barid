name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Optional random-operation tests (hypothesis)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m pip install --quiet hypothesis
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v
        env:
          BARID_SKIP_UI: "1"
      - name: Panel in a real browser (Firefox)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        continue-on-error: true  # the browser tests are a bonus on CI until Firefox there is proven stable; they run on every release locally
        run: python -m unittest tests.test_ui -v
      - name: Example board builds and plans
        run: |
          python examples/build_example.py ./example-project
          python skills/barid/scripts/barid.py --board ./example-project/.barid/board.json plan
          python skills/barid/scripts/barid.py --board ./example-project/.barid/board.json export snapshot.html
          python skills/barid/scripts/barid.py --board ./example-project/.barid/board.json doctor
