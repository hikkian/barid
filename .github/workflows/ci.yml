name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v
      - name: Example board builds and plans
        run: |
          python examples/build_example.py ./example-project
          python skills/relayboard/scripts/rb.py --board ./example-project/.relayboard/board.json plan
          python skills/relayboard/scripts/rb.py --board ./example-project/.relayboard/board.json export snapshot.html
          python skills/relayboard/scripts/rb.py --board ./example-project/.relayboard/board.json doctor
