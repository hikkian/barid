<style>
:root{
  --bg:#022f30;--panel:#06403f;--panel2:#0a5051;--line:#14666a;--tx:#ecf8f6;--mute:#93bdb9;--ac:#feb83b;--acfg:#2a1a00;--lanefg:#04282a;
  --ok:#5fe3c0;--warn:#ffcf6b;--bad:#ff7b8b;--draft:#bda8ff;--shadow:0 6px 24px rgba(0,0,0,.32);
  --l0:#feb83b;--l1:#86f9e4;--l2:#7fb7ff;--l3:#ff9fc0;--l4:#bda8ff;--l5:#6fe0ff;
}
@media (prefers-color-scheme:light){:root{
  --bg:#edf6f5;--panel:#fff;--panel2:#f3faf9;--line:#cfe3e1;--tx:#10282a;--mute:#52706f;--ac:#005b5d;--acfg:#fff;--lanefg:#fff;
  --ok:#0b8a5f;--warn:#a86b00;--bad:#d03348;--draft:#6f4bdc;--shadow:0 6px 24px rgba(0,60,60,.12);
  --l0:#a86b00;--l1:#0b8a5f;--l2:#1763cf;--l3:#c2336f;--l4:#6f4bdc;--l5:#0b7fa6;
}}
*{box-sizing:border-box}
html{color-scheme:dark light}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:10px 20px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px}
.logo .mark{width:30px;height:30px;display:block;border-radius:8px}
.proj{color:var(--mute);font-size:13px}
.spacer{flex:1}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--tx)}
.pill.on{background:var(--ac);border-color:var(--ac);color:var(--acfg)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 13px;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--acfg)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#06251a}
.btn.bad{color:var(--bad)}
.btn.sm{padding:3px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=search],input[type=text],select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;width:100%}
input[type=search]{width:190px;padding:5px 12px;border-radius:999px;font-size:13px}
textarea{min-height:260px;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical}
main{max-width:1180px;margin:0 auto;padding:18px 20px 90px}
h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:26px 0 10px;display:flex;align-items:center;gap:8px}
h2 small{font-weight:500;letter-spacing:0;text-transform:none}
.banner{background:var(--bad);color:#fff;padding:8px 16px;text-align:center;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
/* NOW */
.now{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.lane-card{padding:14px;border-left:4px solid var(--lane,var(--ac))}
.lane-card .lh{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--lane,var(--ac));display:inline-block}
.big{font-size:16px;font-weight:700}
.sub{color:var(--mute);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.together{margin-top:12px;padding:10px 14px;border-radius:12px;border:1px dashed var(--line);font-size:14px}
.together.good{border-color:var(--ok)}
.together.warn{border-color:var(--warn)}
/* chips */
.chip{font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 9px;border:1px solid currentColor;white-space:nowrap;display:inline-block}
.s-ready{color:var(--ok)}.s-running{color:var(--ac)}.s-sent{color:var(--ac)}.s-queued,.s-waiting{color:var(--mute)}
.s-blocked{color:var(--warn)}.s-review{color:var(--warn)}.s-done{color:var(--ok)}.s-cancelled{color:var(--mute)}
.s-draft,.s-proposed{color:var(--draft)}
.o-partial,.o-none{color:var(--warn)}.o-failed{color:var(--bad)}
.s-running::before{content:"● ";animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.s-running::before{animation:none}}
.tag{font-size:11px;border-radius:6px;padding:0 6px;background:var(--panel2);border:1px solid var(--line);color:var(--mute)}
.tag.gpu,.tag.res{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
/* flow */
.step{display:grid;grid-template-columns:110px 1fr;gap:12px;margin-bottom:12px}
@media (max-width:760px){.step{grid-template-columns:1fr}}
.step .sh{padding-top:10px}
.step .sh b{font-size:15px}
.step .items{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.item{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--lane,var(--ac));border-radius:12px;padding:10px 12px;min-width:240px;flex:1 1 260px;max-width:420px;cursor:pointer;text-align:left}
.item:hover{border-color:var(--ac)}
.item.sel{outline:2px solid var(--ac)}
.item.dim{opacity:.75;border-style:dashed}
.item .t{display:flex;gap:8px;align-items:center}
.item .id{font-weight:800;font-size:13px;background:var(--panel2);border-radius:7px;padding:0 7px}
.item .title{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--mute)}
.par{align-self:center;color:var(--ok);font-weight:800;font-size:18px}
/* inbox */
.inbox{display:grid;gap:10px}
.ib{padding:12px 14px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ib .body{flex:1;min-width:240px}
.ib pre{margin:6px 0 0;white-space:pre-wrap;word-break:break-word;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--mute);max-height:90px;overflow:hidden}
/* drawer */
#drawer{position:fixed;top:0;right:0;height:100%;width:min(640px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .18s ease;z-index:40;display:flex;flex-direction:column}
#drawer.open{transform:none}
#drawer .dh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
#drawer .db{padding:14px 18px;overflow:auto;flex:1}
#drawer pre{margin:0;white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;max-height:340px;overflow:auto}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:13px;margin-bottom:12px}
.kv dt{color:var(--mute)}.kv dd{margin:0;word-break:break-word}
.note{font-size:13px;border-left:3px solid var(--line);padding:2px 10px;margin:6px 0}
.note small{color:var(--mute)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formgrid .full{grid-column:1/-1}
label{font-size:12px;color:var(--mute);display:block;margin-bottom:3px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal.open{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(720px,100%);max-height:92vh;overflow:auto;padding:18px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ok);color:#06251a;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;max-width:90vw}
#toast.show{opacity:1}#toast.err{background:var(--bad);color:#fff}
.empty{color:var(--mute);font-style:italic;padding:8px 2px}
details>summary{cursor:pointer;color:var(--mute);margin:6px 0}
.ev{font-size:12.5px;color:var(--mute);padding:2px 0}
.ev b{color:var(--tx)}
</style>
</head>

</main>
